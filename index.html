<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para Esme 🌻</title>
<meta name="description" content="Un jardín de flores amarillas para Esme.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌻%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="petal-field" id="petalField" aria-hidden="true"></div>

<!-- ===== PANTALLA DE INICIO ===== -->
<section class="intro" id="intro">
  <div class="intro-flower-wrap">
    <div class="intro-flower" id="introFlower" role="button" tabindex="0" aria-label="Iniciar">
      <svg id="heroFlowerSvg" viewBox="-60 -60 120 120"></svg>
    </div>
    <div class="click-hint">
      <span class="click-line" aria-hidden="true"></span>
      <span class="click-text">Click aquí</span>
    </div>
  </div>
  <p class="intro-sub">para Esme</p>
</section>

<!-- ===== ESCENA PRINCIPAL ===== -->
<main class="stage" id="stage" hidden>

  <section class="text-panel" id="textPanel">
    <h1 class="title" id="tpTitle"></h1>
    <p class="paragraph" id="tpParagraph"></p>
    <p class="signoff" id="tpSignoff"></p>
    <p class="cursive-line" id="tpCursive"></p>

    <div class="music-box" id="musicBox">
      <button class="music-toggle" id="musicToggle" type="button" aria-label="Pausar música">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <div class="music-meta">
        <span class="music-title">Romantic Pieces</span>
        <span class="music-artist">Antonín Dvořák · violín &amp; piano</span>
      </div>
    </div>

    <button class="replay-btn" id="replayBtn" type="button" hidden>🔄 Volver a vivirlo</button>
  </section>

  <section class="scene" id="scene" aria-hidden="true">
    <svg id="treeSvg" viewBox="0 0 600 700" preserveAspectRatio="xMidYMax meet">
      <line class="ground" x1="10" y1="650" x2="590" y2="650"></line>
      <path id="trunkPath" class="trunk-path" d=""></path>
      <g id="branchesGroup"></g>
      <g id="heartGroup"></g>
    </svg>
  </section>

</main>

<audio id="bgAudio" loop preload="none">
  <source src="assets/audio/romantic.ogg" type="audio/ogg">
  <source src="assets/audio/romantic.mp3" type="audio/mpeg">
</audio>

<script src="assets/js/main.js"></script>
</body>
</html>
